<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Closest Overhead Plane</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151c2e;
      --accent: #38ef7d;
      --accent-alt: #11998e;
      --text-main: #f0f4f8;
      --text-dim: #8a99ad;
      --danger: #ff4b4b;
      --warning: #f1c40f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 30px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.05);
      position: relative;
      overflow: hidden;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      background: rgba(255,255,255,0.05);
      padding: 6px 12px;
      border-radius: 20px;
      color: var(--text-dim);
      margin-bottom: 20px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    .flight-header {
      margin-bottom: 25px;
    }

    .callsign {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #fff, var(--text-dim));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .aircraft-info {
      color: var(--text-dim);
      font-size: 1rem;
      margin-top: 4px;
    }

    .primary-metric {
      background: linear-gradient(135deg, rgba(17, 153, 142, 0.2), rgba(56, 239, 125, 0.1));
      border: 1px solid rgba(56, 239, 125, 0.3);
      border-radius: 15px;
      padding: 20px;
      text-align: center;
      margin-bottom: 25px;
    }

    .primary-metric .label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent);
    }

    .primary-metric .value {
      font-size: 2.2rem;
      font-weight: 700;
      margin-top: 5px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .card {
      background: rgba(0,0,0,0.2);
      padding: 15px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.03);
    }

    .card .label {
      font-size: 0.75rem;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .card .value {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .error-state {
      text-align: center;
      padding: 20px 0;
      color: var(--danger);
    }

    .radar-icon {
      font-size: 3rem;
      margin-bottom: 10px;
      display: inline-block;
      animation: spin 4s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="status-badge">
      <div class="pulse-dot" id="dot"></div>
      <span id="status-text">Acquiring Location...</span>
    </div>

    <div id="content">
      <div style="text-align: center; padding: 40px 0;">
        <div class="radar-icon">📡</div>
        <p style="color: var(--text-dim)">Scanning the sky overhead...</p>
      </div>
    </div>
  </div>

  <script>
    let isFetching = false;
    let pollTimer = null;

    window.addEventListener('DOMContentLoaded', () => {
      if (!('geolocation' in navigator)) {
        renderError("Geolocation is not supported by your browser.");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        position => {
          const userLat = position.coords.latitude;
          const userLon = position.coords.longitude;
          updateStatus('Tracking Sky');

          // Initial fetch immediately
          fetchClosestPlane(userLat, userLon);

          // Refresh every 10 seconds (well within Airplanes.live community rate bounds)
          pollTimer = setInterval(() => {
            fetchClosestPlane(userLat, userLon);
          }, 10000);
        },
        err => {
          renderError(`Location Error: ${err.message}. Please enable location permissions.`);
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    });

    function updateStatus(text, color = null) {
      const el = document.getElementById('status-text');
      const dot = document.getElementById('dot');
      el.innerText = text;
      if (color) {
        dot.style.backgroundColor = color;
        dot.style.boxShadow = `0 0 10px ${color}`;
      } else {
        dot.style.backgroundColor = 'var(--accent)';
        dot.style.boxShadow = '0 0 10px var(--accent)';
        dot.style.animation = 'pulse 1.5s infinite';
      }
    }

    function renderError(msg) {
      const dot = document.getElementById('dot');
      dot.style.backgroundColor = 'var(--danger)';
      dot.style.boxShadow = '0 0 10px var(--danger)';
      dot.style.animation = 'none';
      updateStatus('Error', 'var(--danger)');
      document.getElementById('content').innerHTML = `
        <div class="error-state">
          <p>${msg}</p>
        </div>
      `;
    }

    async function fetchClosestPlane(userLat, userLon) {
      if (isFetching) return;
      isFetching = true;

      // 60 Nautical Miles (~69 miles / 111 km radius around you)
      const radiusNM = 60;
      const url = `https://api.airplanes.live/v2/point/${userLat}/${userLon}/${radiusNM}`;

      try {
        const response = await fetch(url);

        if (!response.ok) {
          throw new Error(`Airplanes API responded with status ${response.status}`);
        }

        const data = await response.json();
        updateStatus('Tracking Sky');

        const aircraftList = data.ac || [];

        // Filter out planes on ground or missing coordinates
        const airbornePlanes = aircraftList.filter(ac => {
          return ac.lat && ac.lon && ac.alt_baro !== 'ground' && ac.alt_baro !== null;
        });

        if (airbornePlanes.length === 0) {
          document.getElementById('content').innerHTML = `
            <div style="text-align: center; padding: 30px 0; color: var(--text-dim);">
              <h2>Clear Skies</h2>
              <p style="margin-top:10px;">No planes airborne overhead within 60 nautical miles.</p>
            </div>`;
          return;
        }

        let closest = null;
        let minDistance = Infinity;

        airbornePlanes.forEach(ac => {
          const distKm = getHaversineDistance(userLat, userLon, ac.lat, ac.lon);
          if (distKm < minDistance) {
            minDistance = distKm;
            closest = {
              hex: ac.hex || 'Unknown',
              callsign: (ac.flight || '').trim() || ac.r || ac.hex.toUpperCase(),
              type: ac.t || 'Unknown Model',
              reg: ac.r || '',
              altitudeFeet: typeof ac.alt_baro === 'number' ? ac.alt_baro : 0,
              speedKnots: ac.gs || 0,
              heading: ac.track || 0,
              vertRateFpm: ac.baro_rate || 0,
              lat: ac.lat,
              lon: ac.lon,
              distKm: distKm
            };
          }
        });

        if (closest) {
          renderPlaneDetails(closest, userLat, userLon);
        }

      } catch (err) {
        // If content is already showing a plane, gracefully show a status flicker instead of wiping out the screen
        if (document.getElementById('content').innerText.includes('Scanning')) {
          renderError(`Unable to fetch aircraft: ${err.message}`);
        } else {
          updateStatus('API Connecting...', 'var(--warning)');
        }
      } finally {
        isFetching = false;
      }
    }

    function getHaversineDistance(lat1, lon1, lat2, lon2) {
      const R = 6371; // km
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = 
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * 
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function calculateBearing(lat1, lon1, lat2, lon2) {
      const y = Math.sin(toRad(lon2 - lon1)) * Math.cos(toRad(lat2));
      const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
                Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(toRad(lon2 - lon1));
      const brng = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
      return brng;
    }

    function toRad(degrees) {
      return degrees * (Math.PI / 180);
    }

    function renderPlaneDetails(plane, userLat, userLon) {
      const horizMiles = (plane.distKm * 0.621371).toFixed(1);
      const altMiles = (plane.altitudeFeet / 5280);
      const slantMiles = Math.sqrt(Math.pow(parseFloat(horizMiles), 2) + Math.pow(altMiles, 2)).toFixed(1);
      
      const speedMph = Math.round(plane.speedKnots * 1.15078);
      const vertSpeedFpm = Math.round(plane.vertRateFpm);

      let vertStatus = "Cruising Level";
      if (vertSpeedFpm > 150) vertStatus = `Climbing (${vertSpeedFpm} ft/min)`;
      if (vertSpeedFpm < -150) vertStatus = `Descending (${vertSpeedFpm} ft/min)`;

      const compassHeading = getCompassDirection(plane.heading);
      const lookDirection = getCompassDirection(calculateBearing(userLat, userLon, plane.lat, plane.lon));

      document.getElementById('content').innerHTML = `
        <div class="flight-header">
          <div class="callsign">${plane.callsign}</div>
          <div class="aircraft-info">${plane.type} ${plane.reg ? '• ' + plane.reg : ''}</div>
        </div>

        <div class="primary-metric">
          <div class="label">Direct 3D Distance Away</div>
          <div class="value">${slantMiles} mi</div>
        </div>

        <div class="grid">
          <div class="card">
            <div class="label">Look Toward</div>
            <div class="value">${lookDirection}</div>
          </div>
          <div class="card">
            <div class="label">Altitude</div>
            <div class="value">${plane.altitudeFeet.toLocaleString()} ft</div>
          </div>
          <div class="card">
            <div class="label">Ground Speed</div>
            <div class="value">${speedMph} mph</div>
          </div>
          <div class="card">
            <div class="label">Flight Heading</div>
            <div class="value">${compassHeading} (${Math.round(plane.heading)}°)</div>
          </div>
          <div class="card" style="grid-column: span 2;">
            <div class="label">Vertical Status</div>
            <div class="value">${vertStatus}</div>
          </div>
        </div>
      `;
    }

    function getCompassDirection(heading) {
      const directions = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
      const index = Math.round(heading / 45) % 8;
      return directions[index];
    }
  </script>
</body>
</html>
